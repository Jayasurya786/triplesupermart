[build]
command = "npm ci && npm run build:client"
publish = "client/dist"

[functions]
directory = "netlify/functions"

[[redirects]]
from = "/api/v1/*"
to = "/.netlify/functions/api/:splat"
status = 200
force = true

[[redirects]]
from = "/api/v1"
to = "/.netlify/functions/api"
status = 200
force = true

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[build.environment]
NODE_VERSION = "20"
VITE_API_BASE_URL = "/api/v1"